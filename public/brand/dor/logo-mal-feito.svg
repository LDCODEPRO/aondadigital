<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 140" width="220" height="140">
  <defs>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF3D3D"/>
      <stop offset="0.25" stop-color="#FFD23D"/>
      <stop offset="0.5" stop-color="#3DFF6E"/>
      <stop offset="0.75" stop-color="#3DB4FF"/>
      <stop offset="1" stop-color="#C33DFF"/>
    </linearGradient>
    <filter id="bevel" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#000" flood-opacity="0.55"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="0" flood-color="#fff" flood-opacity="0.4"/>
    </filter>
  </defs>

  <polygon points="30,100 45,60 20,45 55,42 60,10 72,40 105,30 78,55 100,80 65,68 55,105"
    fill="#FFD23D" stroke="#B8860B" stroke-width="1.5" opacity="0.85"/>

  <path d="M20,118 Q80,140 130,112 T210,118" fill="none" stroke="#3DD65C" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <text x="110" y="72" text-anchor="middle"
    font-family="Impact, 'Arial Black', sans-serif" font-size="34"
    fill="url(#rainbow)" stroke="#7a1d7a" stroke-width="1.5"
    filter="url(#bevel)" transform="rotate(-4 110 72)">
    SUA EMPRESA
  </text>

  <text x="112" y="95" text-anchor="middle"
    font-family="'Comic Sans MS', cursive, sans-serif" font-size="14"
    fill="#fff" stroke="#333" stroke-width="0.6"
    transform="rotate(-4 112 95)">
    ~*~ desde 2011 ~*~
  </text>
</svg>
